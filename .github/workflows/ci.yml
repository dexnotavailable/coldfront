# Shipped by the owner. The coding agent never edits this file (CLAUDE.md, golden rule 12);
# it writes proposed changes to docs/proposed/ instead.
#
# Runs on every push to an open pull request, and on pushes to main. GitHub skips a run
# when the commit message contains [skip ci]; Cloudflare Pages skips its build only when
# the message starts with it, so in-between commits put it first.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Look for the game code
        id: code
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package-lock.json yet (the repo is docs only), so there is nothing to test."
          fi

      - name: Install
        if: steps.code.outputs.present == 'true'
        run: npm ci --no-audit --no-fund

      - name: Check (TypeScript and Biome)
        if: steps.code.outputs.present == 'true'
        run: npm run check --if-present

      - name: Test
        if: steps.code.outputs.present == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.code.outputs.present == 'true'
        run: npm run build --if-present

      - name: Look for the cross-browser golden test
        id: golden
        if: steps.code.outputs.present == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:golden:browsers'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test:golden:browsers script yet; skipping the cross-browser golden test."
          fi

      - name: Install Chromium, Firefox and WebKit
        if: steps.golden.outputs.present == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Golden hashes in three browsers
        if: steps.golden.outputs.present == 'true'
        run: npm run test:golden:browsers
